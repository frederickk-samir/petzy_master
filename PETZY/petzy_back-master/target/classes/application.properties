spring.application.name=petzy_back
server.port=8081

# Datos de conexión
spring.datasource.url=jdbc:postgresql://localhost:5432/petzy_bd
spring.datasource.username=postgres
spring.datasource.password=Alejo1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Cambiado a 'update' para que no borre los datos al reiniciar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración para que Spring Boot ejecute el data.sql en PostgreSQL
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5